<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Paste — TextMop</title>
  <meta name="description" content="Paste formatted text from Word, Google Docs, or a webpage and selectively strip the formatting you don't want — free, runs entirely in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">Text<span>Mop</span></a>
      <nav class="site-nav">
        <a href="index.html">Tools</a>
        <a href="index.html#privacy">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="wrap tool-wrap">

    <div class="tool-header">
      <h1>Clean Paste</h1>
      <p>Paste formatted text below. (Typing isn't supported — paste only.)</p>
    </div>

    <div class="tool-app">
      <div
        id="paste-box"
        class="text-box single-content-box rich-preview"
        contenteditable="true"
        data-placeholder="Click here and paste (Cmd/Ctrl+V) your formatted text..."
      ></div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; 2026 TextMop</span>
      <div class="footer-links">
        <a href="index.html">Tools</a>
        <a href="index.html#privacy">Privacy</a>
      </div>
    </div>
  </footer>

  <script src="clean-paste.js"></script>

</body>
</html>
